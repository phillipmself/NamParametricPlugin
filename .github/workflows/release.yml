name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake --preset mac-release -DNAM_PARAMETRIC_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build --preset mac-release -j $(sysctl -n hw.ncpu)

      - name: Package artifacts
        run: |
          set -euo pipefail
          ARTEFACT_DIR="build/mac-release/NamParametricPlugin_artefacts/Release"
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          ditto -c -k --sequesterRsrc --keepParent \
            "${ARTEFACT_DIR}/Standalone/NAM Parametric Plugin.app" \
            "dist/NAM-Parametric-Plugin-${VERSION}-macOS-Standalone.zip"

          ditto -c -k --sequesterRsrc --keepParent \
            "${ARTEFACT_DIR}/VST3/NAM Parametric Plugin.vst3" \
            "dist/NAM-Parametric-Plugin-${VERSION}-macOS-VST3.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.zip \
            --title "NAM Parametric Plugin ${{ github.ref_name }}" \
            --notes "macOS build (universal: arm64 + x86_64). This build is unsigned/unnotarized — macOS Gatekeeper will block it on first launch. See the README for the one-time steps to allow it to run."
